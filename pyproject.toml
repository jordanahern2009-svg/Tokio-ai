[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokio-ai"
version = "0.1.0"
description = "An open-source financial research agent that runs every claim through honest statistical testing before trusting it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.50.0",
]

[project.scripts]
tokio-ai = "tokio_ai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokio_ai"]
